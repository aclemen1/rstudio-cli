[package]
name = "rstudio-cli"
version = "0.5.2"
edition = "2024"
description = "AI-native CLI bridge to interact with the embedded RStudio Server IDE"
license = "MIT"
repository = "https://github.com/aclemen1/rstudio-cli"
readme = "README.md"
keywords = ["rstudio", "cli", "r", "ide", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rstudio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex-lite = "0.1"
libc = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
