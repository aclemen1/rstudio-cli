[package]
name = "rstudio-cli"
version = "0.8.1"
edition = "2024"
description = "AI-native CLI bridge to drive an RStudio Server (Linux) or RStudio Desktop (macOS) IDE from a terminal"
license = "MIT"
repository = "https://github.com/aclemen1/rstudio-cli"
readme = "README.md"
keywords = ["rstudio", "cli", "r", "ide", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rstudio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex-lite = "0.1"
libc = "0.2"
dirs = "6.0.0"

[profile.release]
lto = "thin"
strip = "symbols"
