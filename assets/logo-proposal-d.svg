<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 577" width="500" height="577">
  <!--
    Hexagone Posit standard : W/H = √3/2 ≈ 0.866
    Circumradius R=277, centre (250,289)
    Sommets pointy-top → points: "250,12 490,151 490,427 250,566 10,427 10,151"
    W=480px, H=554px, ratio=0.866 ✓
  -->
  <polygon points="250,12 490,151 490,427 250,566 10,427 10,151"
           fill="#1A3654" stroke="#4878B0" stroke-width="14" stroke-linejoin="miter"/>

  <!-- ℝ centré horizontalement, décalé vers le haut pour laisser place au wordmark -->
  <text x="250" y="240"
        font-family="'STIX Two Math','Latin Modern Math','Noto Serif',Georgia,'Times New Roman',serif"
        font-size="215" fill="#7AADD8"
        text-anchor="middle" dominant-baseline="central">ℝ</text>

  <!-- ">" vert terminal à gauche de ℝ -->
  <text x="65" y="247"
        font-family="'Courier New',Courier,monospace"
        font-size="88" fill="#28C840"
        text-anchor="start" dominant-baseline="central">&gt;</text>

  <!-- Curseur clignotant à droite de ℝ -->
  <rect x="336" y="206" width="27" height="68" fill="#28C840" opacity="0.90"/>

  <!-- Wordmark à l'intérieur, dans la zone large (y < 427) -->
  <text x="250" y="422"
        font-family="Inter,'Helvetica Neue',Arial,sans-serif"
        font-size="52" font-weight="700" fill="#8BBCDA"
        text-anchor="middle" letter-spacing="-0.5">rstudio-cli</text>
</svg>
